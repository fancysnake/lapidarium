[settings]
experimental = true
# Tasks listed in `depends` run in parallel; `run = [...]` is sequential.
jobs = 8

[hooks]
enter = "poetry install"

[tools]
"github:dmno-dev/varlock" = "1.23.0"
pipx = "1.17.14"
"pipx:poetry" = "2.5.1"
python = "3.14.7"

[env]
_.python.venv = { path = ".venv", create = true }
_.file = "env/development.env"
PYTHONPATH = "src"
# Consumed by shared-configs' python.toml.
PACKAGE = "lapidarium"
SRC_PATHS = "src"
TEST_PATHS = "tests"
SCRIPT_PATHS = ""
TOML_PATHS = "*.toml .taplo.toml .vekna.toml docker/*.toml"

[task_config]
includes = [
    "tasks.toml",
    "git::https://github.com/fancysnake/shared-configs.git//python.toml",
]
