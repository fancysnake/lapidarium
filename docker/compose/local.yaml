---
# Local development: only the database. Django runs on the host (`mise run start`).
name: lapidarium

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lapidarium
      POSTGRES_USER: lapidarium
      POSTGRES_PASSWORD: lapidarium
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lapidarium -d lapidarium"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
