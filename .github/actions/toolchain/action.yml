---
name: Toolchain
description: Install the mise toolchain and restore the cached Poetry virtualenv.

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock', 'mise.toml') }}
        restore-keys: |
          venv-${{ runner.os }}-
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5
    - run: mise install
      shell: bash
    - name: Drop stale virtualenv
      run: .venv/bin/python --version || rm -rf .venv
      shell: bash
    - run: mise exec -- poetry install
      shell: bash
