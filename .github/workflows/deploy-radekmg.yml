---
name: Deploy radekmg.pl

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radekmg-deploy
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      environment: radekmg.pl
      environment_url: https://radekmg.pl
      sha: ${{ github.sha }}
    secrets: inherit
