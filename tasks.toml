# Project tasks. Python format/lint/test tasks live in python_tasks.toml.

[dj]
description = "Run any django-admin subcommand against the dev settings"
run = "django-admin"

[start]
description = "Start the Django dev server on :8000"
run = "django-admin runserver 0.0.0.0:8000"

[db]
description = "Start the local PostgreSQL container"
run = "docker compose -f docker/compose/local.yaml up -d"

["db:down"]
description = "Stop the local PostgreSQL container (data volume is kept)"
run = "docker compose -f docker/compose/local.yaml down"

[dc]
description = "Run docker compose for a target environment (local or prod)"
usage = '''
arg "<environment>" help="Target environment" {
  choices "local" "prod"
}
arg "[dc_args]" var=#true double_dash="optional"
'''
run = 'docker compose -f docker/compose/{{ usage.environment }}.yaml {{arg(name="dc_args")}}'

[update]
description = "Update all dependencies: mise tools, pip, Poetry packages"
run = [
    "mise upgrade --bump --exclude python --minimum-release-age=7d",
    "mise install",
    { task = "dep:upgrade:py" },
]

[check]
description = "Format, then lint (autofix where the tool can)"
run = [{ task = "format:py" }, { task = "lint:py" }]

[pr-fix]
description = "The absolute gate the rituals repair until green: format, lint, every test with coverage, diff coverage"
run = [
    "poetry install",
    { task = "format:py" },
    { task = "lint:py" },
    { task = "test:py:cov:diff" },
]

[fullcheck]
description = "The commit gate for people: pr-fix plus the debt budget, which needs judgement when it fails"
run = [{ task = "pr-fix" }, { task = "lint:tingle" }]

["i18n:make"]
description = "Extract UI strings into the pl and en catalogs"
dir = "src/lapidarium"
run = "django-admin makemessages -l pl -l en --no-location --no-wrap"

["i18n:compile"]
description = "Compile the catalogs; .mo files are build output, never committed"
dir = "src/lapidarium"
run = "django-admin compilemessages"

# `--only docs --no-root` because mkdocs.yml declares no plugins: nothing here
# imports the package, so neither the package nor the dev group is worth
# installing. `--only` alone still installs the root project.
["site:deps"]
description = "Install the documentation site's dependencies"
hide = true
run = "poetry install --only docs --no-root --quiet"

["site:dev"]
description = "Serve the documentation site on :8001, beside the dev server, with live reload"
depends = ["site:deps"]
run = "mkdocs serve --dev-addr localhost:8001"

["site:build"]
description = "Build the documentation site into site/"
depends = ["site:deps"]
run = "mkdocs build"
