<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" role="img" aria-label="A content type shapes every entry of that type; an entry is built from ordered parts, uses media assets, belongs to containers through part of and links to related entries; published entries, the profile and external items render as the public site's pages and feeds; the same model exports to plain files." font-size="12" fill="currentColor">
  <desc>A content type shapes every entry of that type; an entry is built from ordered parts, uses media assets, belongs to containers through part of and links to related entries; published entries, the profile and external items render as the public site's pages and feeds; the same model exports to plain files.</desc>
  <defs>
    <marker id="cm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-size="11" font-weight="600" letter-spacing="0.08em" opacity="0.7">
    <text x="20" y="24">SET UP IN THE ADMIN</text>
    <text x="20" y="462">PUBLIC SITE</text>
  </g>
  <g stroke="currentColor" stroke-width="1.25" fill="currentColor" fill-opacity="0.04">
    <rect x="20" y="40" width="210" height="80" rx="8"/>
    <rect x="20" y="160" width="210" height="260" rx="8"/>
    <rect x="32" y="302" width="186" height="98" rx="6"/>
    <rect x="290" y="40" width="230" height="80" rx="8"/>
    <rect x="570" y="40" width="130" height="80" rx="8"/>
    <rect x="570" y="300" width="130" height="90" rx="8"/>
  </g>
  <rect x="290" y="160" width="230" height="260" rx="8" fill-opacity="0.1" stroke-width="2.5" style="fill: var(--lapidarium-cyan, #00b8d4); stroke: var(--lapidarium-cyan, #00b8d4)"/>
  <g font-size="14" font-weight="600">
    <text x="36" y="66">Profile &amp; links</text>
    <text x="36" y="186">Content type</text>
    <text x="44" y="324" font-size="13">Fields</text>
    <text x="306" y="66">Container entry</text>
    <text x="306" y="186">Entry</text>
    <text x="584" y="66">External item</text>
    <text x="584" y="322">Media asset</text>
  </g>
  <g>
    <text x="36" y="88">name · tagline · photo</text>
    <text x="36" y="106">bio · e-mail · links</text>
    <text x="36" y="210">label · key · route</text>
    <text x="36" y="230">role · layout · colour</text>
    <text x="36" y="250">allowed and required parts</text>
    <text x="36" y="270">home door · in menu</text>
    <text x="36" y="290">list filters</text>
    <text x="44" y="344">text · long text · url</text>
    <text x="44" y="364">date · number · bool</text>
    <text x="44" y="384">choice · relation</text>
    <text x="306" y="88">role: outcome or timespan</text>
    <text x="306" y="106">a project, a campaign, a season</text>
    <text x="306" y="210">title · slug · summary</text>
    <text x="306" y="230">status · tags · field values</text>
    <text x="584" y="88">a post elsewhere,</text>
    <text x="584" y="106">entered by hand</text>
    <text x="584" y="342">a file + alt text,</text>
    <text x="584" y="360">used by image, file</text>
    <text x="584" y="378">and audio parts</text>
  </g>
  <g stroke-width="1" fill-opacity="0.16" style="fill: var(--lapidarium-cyan, #00b8d4); stroke: var(--lapidarium-cyan, #00b8d4)">
    <rect x="302" y="246" width="206" height="30" rx="4"/>
    <rect x="302" y="282" width="206" height="30" rx="4"/>
    <rect x="302" y="318" width="206" height="30" rx="4"/>
    <rect x="302" y="354" width="206" height="30" rx="4"/>
  </g>
  <g>
    <text x="314" y="266"><tspan font-weight="600">1</tspan>  Text — markdown</text>
    <text x="314" y="302"><tspan font-weight="600">2</tspan>  Video — plays on click</text>
    <text x="314" y="338"><tspan font-weight="600">3</tspan>  Image — asset + alt text</text>
    <text x="314" y="374"><tspan font-weight="600">4</tspan>  Link · Audio · File …</text>
    <text x="508" y="404" text-anchor="end" font-size="11" opacity="0.7">ordered parts</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#cm-arrow)">
    <line x1="230" y1="290" x2="286" y2="290"/>
    <line x1="405" y1="160" x2="405" y2="124"/>
    <path d="M520,186 C558,186 558,226 524,226"/>
