    <text x="562" y="210">related</text>
    <text x="547" y="337" text-anchor="middle">uses</text>
    <text x="413" y="450">published</text>
  </g>
  <g stroke="currentColor" stroke-width="1.25" fill="currentColor" fill-opacity="0.04">
    <rect x="20" y="476" width="155" height="50" rx="6"/>
    <rect x="195" y="476" width="155" height="50" rx="6"/>
    <rect x="370" y="476" width="155" height="50" rx="6"/>
    <rect x="545" y="476" width="155" height="50" rx="6"/>
    <rect x="20" y="538" width="155" height="50" rx="6"/>
    <rect x="195" y="538" width="155" height="50" rx="6"/>
    <rect x="370" y="538" width="155" height="50" rx="6"/>
    <rect x="545" y="538" width="155" height="50" rx="6"/>
  </g>
  <g font-size="13" font-weight="600">
    <text x="32" y="496">Menu</text>
    <text x="207" y="496">Home</text>
    <text x="382" y="496">List page</text>
    <text x="557" y="496">Detail page</text>
    <text x="32" y="558">About</text>
    <text x="207" y="558">What’s new · RSS</text>
    <text x="382" y="558">Calendar .ics</text>
    <text x="557" y="558">Search</text>
  </g>
  <g font-size="11" opacity="0.8">
    <text x="32" y="514">types with in menu</text>
    <text x="207" y="514">doors · next up · new</text>
    <text x="382" y="514">/route/ · field filters</text>
    <text x="557" y="514">layout · parts · links</text>
    <text x="32" y="576">profile · timeline</text>
    <text x="207" y="576">entries · external items</text>
    <text x="382" y="576">calendar-type entries</text>
    <text x="557" y="576">titles, text, fields</text>
  </g>
  <rect x="20" y="612" width="680" height="76" rx="8" fill="none" stroke="currentColor" stroke-width="1.25" stroke-dasharray="6 5"/>
  <text x="36" y="636" font-size="14" font-weight="600">Export format v1 — the same model as plain files</text>
  <text x="36" y="658" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">profile.yaml · types/&lt;key&gt;.yaml · content/&lt;type&gt;/&lt;slug&gt;.md · assets/</text>
  <text x="36" y="678" font-size="11" opacity="0.8">written by export_content, read back by import_content</text>
</svg>
