  </g>
  <g font-size="11" opacity="0.8">
    <text x="32" y="56">last for a time: a start, maybe an end</text>
    <text x="32" y="71">purposes: job · volunteering · craft · skill</text>
    <text x="32" y="212">work towards a result</text>
    <text x="32" y="227">purpose: project</text>
    <text x="32" y="368">finished things, each on its own page</text>
    <text x="32" y="383">purpose: piece of work</text>
