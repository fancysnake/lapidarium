    <text x="382" y="703">purpose: section</text>
    <text x="32" y="778">also Copernicon 2026 and Otwarte sesje online</text>
  </g>
  <g font-size="11">
    <text x="382" y="58">Each band is one mechanic and names its purposes.</text>
    <text x="382" y="76">Each box is one entry: its title, then its type.</text>
    <text x="382" y="94"><tspan font-weight="600">part of</tspan> — the entry belongs to a container</text>
    <text x="382" y="110"><tspan font-weight="600">related</tspan> — a loose link, shown on both pages</text>
    <text x="382" y="126"><tspan font-weight="600">inspired by</tspan> — a relation field of the song type</text>
  </g>
