<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 810" width="720" height="810" role="img" aria-label="The ttrpg demo site, its entries grouped by mechanic. Activities: Sesje science fiction, a craft. Projects: the campaigns Kampania Mothership, part of that craft, and Klątwa Strahda. Pieces of work: two sessions, each part of one campaign; a song inspired by a session; a meme related to the same session; a game; an article. Events: the convention Pyrkon 2027, related to the game. Sections: the wiki section Prowadzenie, which the article is part of." font-size="12" fill="currentColor">
  <desc>The ttrpg demo site, its entries grouped by mechanic. Activities: Sesje science fiction, a craft. Projects: the campaigns Kampania Mothership, part of that craft, and Klątwa Strahda. Pieces of work: two sessions, each part of one campaign; a song inspired by a session; a meme related to the same session; a game; an article. Events: the convention Pyrkon 2027, related to the game. Sections: the wiki section Prowadzenie, which the article is part of.</desc>
