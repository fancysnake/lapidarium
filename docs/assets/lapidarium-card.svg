<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="card-alt">
  <desc id="card-alt">lapidarium: a home base for multi-format creators, every piece of work at its own address. The logo: four cut stones in a frame, on a cyan tile.</desc>

  <rect width="1200" height="630" fill="#0b1e22"/>

  <!-- The text block. -->
  <rect x="80" y="150" width="64" height="6" fill="#00b8d4"/>
  <text x="76" y="270" font-family="Bitstream Charter, Liberation Serif, serif" font-size="104" font-weight="bold" fill="#ffffff">lapidarium</text>
  <text x="80" y="340" font-family="Liberation Sans, FreeSans, sans-serif" font-size="38" fill="#4dd0e1">A home base for</text>
  <text x="80" y="388" font-family="Liberation Sans, FreeSans, sans-serif" font-size="38" fill="#4dd0e1">multi-format creators</text>
  <text x="80" y="470" font-family="Liberation Sans, FreeSans, sans-serif" font-size="26" fill="#c9d6d9">Every piece of work at its own address</text>
  <text x="80" y="506" font-family="Liberation Sans, FreeSans, sans-serif" font-size="26" fill="#c9d6d9">Django · PostgreSQL · zero Node</text>
  <text x="80" y="566" font-family="Liberation Mono, monospace" font-size="22" fill="#62ebff">lapidarium.fancysnake.dev</text>

  <!-- The logo, black on the cyan of the docs header. -->
  <rect x="780" y="135" width="360" height="360" rx="24" fill="#00b8d4"/>
  <g transform="translate(800 155) scale(0.3125)" fill="#000000">
    <path fill-rule="evenodd" d="M64 64H960V960H64Z M128 128V896H896V128Z"/>
    <rect x="192" y="192" width="256" height="256"/>
    <polygon points="640,192 768,192 832,256 704,448 576,256"/>
    <polygon points="256,576 384,576 448,640 448,768 384,832 256,832 192,768 192,640"/>
    <circle cx="704" cy="704" r="128"/>
  </g>
</svg>
