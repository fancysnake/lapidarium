{% load i18n lapidarium %}
<section class="showcase"
         data-type="{{ showcase.type_key }}"
         aria-labelledby="showcase-{{ index }}-title">
  <div class="container showcase__inner">
    <h2 class="section-title showcase__title" id="showcase-{{ index }}-title">{{ showcase.title }}</h2>
    {% if showcase.intro %}
      <div class="showcase__intro part-text">{{ showcase.intro|markdown }}</div>
    {% endif %}
    <ol class="showcase__items">
      {% for entry in showcase.entries %}
        <li class="showcase__item">
          <h3 class="pick__title">{{ entry.title }}</h3>
          <p class="pick__summary">{{ entry.summary }}</p>
          <a class="pick__more" href="{% entry_url entry %}">{% translate "Take a look" %}<span class="visually-hidden">: {{ entry.title }}</span> →</a>
        </li>
      {% endfor %}
    </ol>
  </div>
</section>
