{% load i18n static %}<!DOCTYPE html>
{% get_current_language as language %}
<html lang="{{ language }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {% block title %}{{ site_name }}{% endblock title %}
    </title>
    {% block head %}
    {% endblock head %}
    <script type="module" src="{% static 'lapidarium/js/enhance.js' %}"></script>
  </head>
  <body>
    {% block body %}
    {% endblock body %}
  </body>
</html>
